<title>Gitdeck</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout concept: a pegboard of widgets on a 3-column grid. Edit mode exposes a toolbar on every widget and a customize panel under the header. */
:root {
  --bg: #f1f3ef;
  --surface: #fbfcfa;
  --ink: #141a18;
  --muted: #5a6560;
  --line: #dde2dc;
  --cell0: #e3e8e2;
  --on-accent: #ffffff;
  --hue: 150;
  --accent: oklch(0.52 0.14 var(--hue));
  --accent-soft: color-mix(in oklch, var(--accent) 12%, var(--surface));
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --font-body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --gap: 14px;
  --pad: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1211; --surface: #151b19; --ink: #e6ece8; --muted: #8b9892; --line: #243030;
    --cell0: #1e2826; --on-accent: #0a100e;
    --accent: oklch(0.76 0.16 var(--hue));
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1211; --surface: #151b19; --ink: #e6ece8; --muted: #8b9892; --line: #243030;
  --cell0: #1e2826; --on-accent: #0a100e;
  --accent: oklch(0.76 0.16 var(--hue));
  color-scheme: dark;
}
:root[data-density="compact"] { --gap: 8px; --pad: 11px; }
:root[data-density="roomy"] { --gap: 20px; --pad: 22px; }

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 14px; line-height: 1.5;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--gap); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; justify-content: space-between; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 26px; letter-spacing: -0.02em; display: flex; align-items: baseline; gap: 10px; }
.brand small { font-family: var(--font-mono); font-weight: 400; font-size: 11px; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-width: 0; }
.user-form { display: flex; gap: 6px; min-width: 0; }
.field {
  display: flex; align-items: center; background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; padding: 0 10px; min-width: 0;
}
.field span { color: var(--muted); font-family: var(--font-mono); font-size: 12px; }
.field input { background: none; border: 0; padding: 8px 4px; width: 150px; min-width: 0; outline: none; font-family: var(--font-mono); font-size: 13px; }
.field:focus-within { border-color: var(--accent); }
.btn {
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 12px; font-weight: 500; color: var(--ink);
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.status {
  display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; font-size: 12.5px; color: var(--muted);
}
.badge {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase;
  padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface);
}
.badge.live { border-color: var(--accent); color: var(--accent); }
.badge.sample { border-style: dashed; }

/* customize panel */
.panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: var(--pad);
  display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 18px 24px;
}
.group { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.group h3, .w h2 {
  margin: 0; font-family: var(--font-mono); font-weight: 500; font-size: 11px;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
}
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; align-self: flex-start; }
.seg button { background: none; border: 0; padding: 6px 12px; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.sw { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); padding: 0; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: none; border: 1px dashed var(--line); border-radius: 99px; padding: 4px 11px; color: var(--muted); }
.chip[aria-pressed="true"] { border-style: solid; border-color: var(--accent); color: var(--ink); background: var(--accent-soft); }
.panel.wide { grid-column: 1 / -1; }
textarea.json {
  width: 100%; min-height: 70px; resize: vertical; background: var(--bg); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px; font-family: var(--font-mono); font-size: 11.5px;
}
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.hint { color: var(--muted); font-size: 12.5px; margin: 0; }

/* grid + widgets */
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--gap); grid-auto-flow: dense; }
.s1 { grid-column: span 1; } .s2 { grid-column: span 2; } .s3 { grid-column: span 3; }
@media (max-width: 900px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .s3 { grid-column: span 2; } }
@media (max-width: 600px) { .grid { grid-template-columns: minmax(0, 1fr); } .s2, .s3 { grid-column: span 1; } .brand { font-size: 22px; } }
.w {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: var(--pad);
  display: flex; flex-direction: column; gap: 12px; min-width: 0;
}
.w-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 22px; }
.tools { display: none; gap: 4px; }
.editing .tools { display: flex; }
.editing .w { border-style: dashed; }
.editing .w[draggable="true"] { cursor: grab; }
.w.dragging { opacity: 0.4; }
.w.over { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.tool { min-width: 28px; height: 28px; padding: 0 6px; border: 1px solid var(--line); background: var(--bg); border-radius: 6px; font-family: var(--font-mono); font-size: 12px; }
.tool:hover { border-color: var(--accent); }
.tool:disabled { opacity: 0.35; cursor: default; }

.empty { color: var(--muted); text-align: center; padding: 28px 16px; border: 1px dashed var(--line); border-radius: 10px; }

/* profile */
.who { display: flex; gap: 12px; align-items: center; min-width: 0; }
.avatar {
  width: 52px; height: 52px; flex: none; border-radius: 12px; background: var(--accent); color: var(--on-accent);
  display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 22px;
}
.who h3 { margin: 0; font-family: var(--font-display); font-size: 19px; line-height: 1.15; overflow-wrap: anywhere; }
.who p { margin: 0; color: var(--muted); font-family: var(--font-mono); font-size: 12px; overflow-wrap: anywhere; }
.bio { margin: 0; color: var(--muted); }
.meta { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.meta b { color: var(--ink); font-variant-numeric: tabular-nums; }

/* stats */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 10px; }
.tile { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--bg); }
.tile b { display: block; font-family: var(--font-display); font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile span { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }

/* heatmap */
.heat { display: grid; grid-template-columns: repeat(20, minmax(0, 1fr)); gap: 3px; }
.cell { aspect-ratio: 1; border-radius: 3px; background: var(--cell0); }
.cell.l1 { background: color-mix(in oklch, var(--accent) 28%, var(--cell0)); }
.cell.l2 { background: color-mix(in oklch, var(--accent) 52%, var(--cell0)); }
.cell.l3 { background: color-mix(in oklch, var(--accent) 76%, var(--cell0)); }
.cell.l4 { background: var(--accent); }
.cell.future { visibility: hidden; }
.legend { display: flex; align-items: center; gap: 4px; justify-content: flex-end; color: var(--muted); font-size: 11.5px; font-family: var(--font-mono); }
.legend .cell { width: 11px; aspect-ratio: 1; }
.caption { color: var(--muted); font-size: 12.5px; margin: 0; }

/* bars */
.bars { display: flex; flex-direction: column; gap: 9px; }
.bar-row { display: grid; grid-template-columns: minmax(0, 9.5em) minmax(0, 1fr) 3.2em; gap: 10px; align-items: center; font-size: 12.5px; }
.bar-row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-mono); font-size: 12px; }
.bar-row .val { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); font-family: var(--font-mono); font-size: 12px; }
.track { height: 8px; background: var(--cell0); border-radius: 4px; overflow: hidden; }
.fill { height: 100%; background: var(--accent); border-radius: 4px; }
.stack { display: flex; height: 10px; border-radius: 5px; overflow: hidden; gap: 2px; }
.stack i { display: block; height: 100%; }
.keys { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; }
.keys div { display: flex; align-items: center; gap: 8px; }
.keys .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.keys .pct { margin-left: auto; color: var(--muted); font-family: var(--font-mono); font-size: 12px; font-variant-numeric: tabular-nums; }

/* repo list + feed */
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.list li { padding: 10px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.list li:first-child { border-top: 0; padding-top: 0; }
.list li:last-child { padding-bottom: 0; }
.list .title { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.list .title a, .list .title strong { font-family: var(--font-mono); font-size: 13px; font-weight: 500; color: var(--accent); text-decoration: none; overflow-wrap: anywhere; }
.list .title a:hover { text-decoration: underline; }
.list .sub { color: var(--muted); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 4px 14px; font-variant-numeric: tabular-nums; }
.list .sub .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }
.kind { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; white-space: nowrap; }
.time { color: var(--muted); font-size: 12px; white-space: nowrap; }

/* streak */
.big { font-family: var(--font-display); font-size: 44px; font-weight: 700; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.big small { font-size: 15px; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-left: 4px; }
.streak { display: flex; flex-direction: column; gap: 10px; }

/* notes */
.notes { width: 100%; min-height: 120px; flex: 1; resize: vertical; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 20; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: no-preference) { .fill { transition: width .4s ease; } .w { transition: border-color .15s, box-shadow .15s; } }
</style>

<div class="wrap" id="app">
  <header class="bar">
    <div class="brand">Gitdeck <small>your GitHub, your layout</small></div>
    <div class="controls">
      <form class="user-form" id="userForm">
        <label class="field" for="userInput"><span>github.com/</span><input id="userInput" autocomplete="off" spellcheck="false" placeholder="username"></label>
        <button class="btn primary" type="submit">Load</button>
      </form>
      <button class="btn" id="editBtn" type="button" aria-pressed="false">Customize</button>
    </div>
  </header>
  <div class="status" id="status"></div>
  <section class="panel" id="panel" hidden>
    <div class="group"><h3>Theme</h3>
      <div class="seg" id="themeSeg"><button data-v="auto">Auto</button><button data-v="light">Light</button><button data-v="dark">Dark</button></div>
    </div>
    <div class="group"><h3>Accent</h3><div class="swatches" id="swatches"></div></div>
    <div class="group"><h3>Spacing</h3>
      <div class="seg" id="densitySeg"><button data-v="compact">Compact</button><button data-v="cozy">Cozy</button><button data-v="roomy">Roomy</button></div>
    </div>
    <div class="group wide"><h3>Widgets</h3><div class="chips" id="chips"></div>
      <p class="hint">Drag a widget by its card to reorder, or use the arrows. S, M and L set how many columns it spans.</p>
    </div>
    <div class="group wide"><h3>Share or restore a layout</h3>
      <textarea class="json" id="layoutJson" aria-label="Layout JSON" spellcheck="false"></textarea>
      <div class="row">
        <button class="btn" id="copyLayout" type="button">Copy layout</button>
        <button class="btn" id="applyLayout" type="button">Apply pasted layout</button>
        <button class="btn" id="resetLayout" type="button">Reset to default</button>
      </div>
    </div>
  </section>
  <main class="grid" id="grid"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function () {
  var LS = "gitdeck.v1";
  var WIDGETS = {
    profile:  { title: "Profile", size: 1 },
    stats:    { title: "Totals", size: 2 },
    heatmap:  { title: "Contribution calendar", size: 3 },
    streak:   { title: "Streaks", size: 1 },
    languages:{ title: "Languages", size: 1 },
    repos:    { title: "Top repositories", size: 2 },
    stars:    { title: "Stars by repository", size: 2 },
    mix:      { title: "Activity mix", size: 1 },
    feed:     { title: "Recent activity", size: 2 },
    notes:    { title: "Notes", size: 1 }
  };
  var DEFAULT_LAYOUT = [
    ["profile",1],["stats",2],["heatmap",3],["repos",2],["languages",1],["feed",2],["streak",1],["notes",1]
  ];
  var ACCENTS = [["Green",150],["Blue",250],["Violet",295],["Amber",70],["Rose",10]];
  var LANG = { JavaScript:"#f1e05a", TypeScript:"#3178c6", Python:"#3572A5", Go:"#00ADD8", Rust:"#dea584", Ruby:"#cc342d", Java:"#b07219", C:"#8a8a8a", "C++":"#f34b7d", Shell:"#89e051", HTML:"#e34c26", CSS:"#7a5bb0", Swift:"#F05138", Kotlin:"#A97BFF" };
  var DAYS = 20 * 7;

  function defaults() {
    return { user: "octocat", theme: "auto", hue: 150, density: "cozy", note: "",
      widgets: DEFAULT_LAYOUT.map(function (w) { return { id: w[0], size: w[1] }; }) };
  }
  var S = defaults();
  try { var raw = localStorage.getItem(LS); if (raw) S = Object.assign(defaults(), JSON.parse(raw)); } catch (e) {}
  function save() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} }

  var D = null;          // current data
  var editing = false;
  var dragId = null;
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function fmt(n) { return Number(n || 0).toLocaleString("en-US"); }
  function toast(msg) { var t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function () { t.hidden = true; }, 3200); }

  /* ---------- dates ---------- */
  function key(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function ago(iso) {
    var s = (Date.now() - new Date(iso).getTime()) / 1000;
    if (s < 3600) return Math.max(1, Math.round(s / 60)) + "m ago";
    if (s < 86400) return Math.round(s / 3600) + "h ago";
    if (s < 86400 * 60) return Math.round(s / 86400) + "d ago";
    return Math.round(s / 86400 / 30) + "mo ago";
  }

  /* ---------- sample data (seeded by username) ---------- */
  function hash(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function makeSample(user) {
    var r = rng(hash(user));
    var names = ["api-gateway","dotfiles","react-playground","log-parser","blog","rust-notes","ml-sandbox","cli-tools","dashboard","ansible-lab","go-queue","css-tricks","weather-bot","algorithms","infra"];
    var langs = ["TypeScript","Python","Go","Rust","JavaScript","Shell","Java","C++","CSS"];
    var descs = ["Small service for routing requests","Personal config files","Experiments with components","Parses and summarizes log lines","Static site for writing","Notes while learning","Notebooks and training scripts","Handy command line helpers","Metrics at a glance","Automation playbooks","Job queue with retries","Layout experiments","Posts the forecast every morning","Practice problems","Terraform modules"];
    var repos = names.map(function (n, i) {
      return { name: n, stars: Math.floor(Math.pow(r(), 3) * 2600), forks: Math.floor(Math.pow(r(), 3) * 340), lang: langs[Math.floor(r() * langs.length)], desc: descs[i], updated: new Date(Date.now() - r() * 86400000 * 200).toISOString(), url: "" };
    });
    var daily = {}; var today = startOfDay(new Date());
    for (var i = 0; i < DAYS; i++) {
      var d = new Date(today); d.setDate(d.getDate() - i);
      var wk = d.getDay() === 0 || d.getDay() === 6 ? 0.45 : 1;
      daily[key(d)] = r() < 0.62 * wk + 0.1 ? Math.floor(1 + r() * r() * 14) : 0;
    }
    var kinds = [["PushEvent","Pushed 3 commits to"],["PullRequestEvent","Opened pull request #41 in"],["IssuesEvent","Opened issue #18 in"],["PushEvent","Pushed 1 commit to"],["PullRequestReviewEvent","Reviewed pull request #37 in"],["WatchEvent","Starred"],["CreateEvent","Created branch fix-retries in"],["IssueCommentEvent","Commented on #12 in"]];
    var events = []; var t = Date.now();
    for (var j = 0; j < 24; j++) {
      t -= (0.4 + r() * 9) * 3600000; var k = kinds[Math.floor(r() * kinds.length)];
      events.push({ type: k[0], text: k[1], repo: repos[Math.floor(r() * repos.length)].name, date: new Date(t).toISOString() });
    }
    return { source: "sample", user: { login: user, name: user.charAt(0).toUpperCase() + user.slice(1), bio: "Example profile. Load a real username to replace this.", followers: Math.floor(r() * 900), following: Math.floor(r() * 120), public_repos: repos.length, created: "2016-04-12" }, repos: repos, events: events, daily: daily };
  }

  /* ---------- live data ---------- */
  async function gh(path) {
    var res = await fetch("https://api.github.com" + path, { headers: { Accept: "application/vnd.github+json" } });
    if (res.status === 404) throw { code: "notfound" };
    if (res.status === 403 || res.status === 429) throw { code: "rate" };
    if (!res.ok) throw { code: "http", status: res.status };
    return res.json();
  }
  async function makeLive(user) {
    var out = await Promise.all([gh("/users/" + encodeURIComponent(user)), gh("/users/" + encodeURIComponent(user) + "/repos?per_page=100&sort=pushed"), gh("/users/" + encodeURIComponent(user) + "/events/public?per_page=100")]);
    var u = out[0], rp = out[1], ev = out[2];
    var daily = {};
    ev.forEach(function (e) {
      var n = e.type === "PushEvent" ? ((e.payload && (e.payload.size || (e.payload.commits || []).length)) || 1) : 1;
      var k = key(new Date(e.created_at)); daily[k] = (daily[k] || 0) + n;
    });
    var events = ev.map(function (e) {
      var p = e.payload || {}, a = p.action || "";
      var map = {
        PushEvent: "Pushed " + ((p.size || (p.commits || []).length) || 1) + " commit(s) to",
        PullRequestEvent: (a || "Updated") + " pull request #" + ((p.pull_request && p.pull_request.number) || "") + " in",
        PullRequestReviewEvent: "Reviewed a pull request in",
        IssuesEvent: (a || "Updated") + " issue #" + ((p.issue && p.issue.number) || "") + " in",
        IssueCommentEvent: "Commented on #" + ((p.issue && p.issue.number) || "") + " in",
        WatchEvent: "Starred", ForkEvent: "Forked", CreateEvent: "Created " + (p.ref_type || "something") + " in", ReleaseEvent: "Published a release in"
      };
      return { type: e.type, text: map[e.type] || e.type.replace("Event", ""), repo: (e.repo && e.repo.name || "").replace(/^[^/]+\//, ""), date: e.created_at };
    });
    return { source: "live", user: { login: u.login, name: u.name || u.login, bio: u.bio || "", followers: u.followers, following: u.following, public_repos: u.public_repos, created: u.created_at }, repos: rp.map(function (r) { return { name: r.name, stars: r.stargazers_count, forks: r.forks_count, lang: r.language, desc: r.description || "", updated: r.pushed_at || r.updated_at, url: r.html_url }; }), events: events, daily: daily };
  }

  async function load(user, tryLive) {
    user = (user || "").trim().replace(/^@/, "");
    if (!/^[A-Za-z0-9-]{1,39}$/.test(user)) { toast("Enter a GitHub username (letters, numbers, hyphens)."); return; }
    S.user = user; save(); $("userInput").value = user;
    var note = "";
    if (tryLive) {
      $("status").innerHTML = '<span class="badge">Loading</span><span>Asking GitHub for ' + esc(user) + '...</span>';
      try { D = await makeLive(user); renderAll(); return; }
      catch (e) {
        if (e && e.code === "notfound") note = "GitHub has no user named " + user + ". Showing sample data instead.";
        else if (e && e.code === "rate") note = "GitHub's rate limit for anonymous requests is used up. Try again in a few minutes. Showing sample data.";
        else note = "Could not reach GitHub from this page, so you are seeing sample data. Pages opened from a saved file can usually reach it.";
      }
    }
    D = makeSample(user); D.note = note; renderAll();
  }

  /* ---------- widgets ---------- */
  function langColor(l) { return LANG[l] || "oklch(0.65 0.1 " + (hash(l || "x") % 360) + ")"; }
  function streaks() {
    var today = startOfDay(new Date()), cur = 0, best = 0, run = 0;
    for (var i = DAYS - 1; i >= 0; i--) {
      var d = new Date(today); d.setDate(d.getDate() - i);
      if ((D.daily[key(d)] || 0) > 0) { run++; best = Math.max(best, run); } else run = 0;
    }
    var i2 = 0; var d0 = new Date(today);
    if (!(D.daily[key(d0)] > 0)) d0.setDate(d0.getDate() - 1);
    while (i2 < DAYS && (D.daily[key(d0)] || 0) > 0) { cur++; d0.setDate(d0.getDate() - 1); i2++; }
    var total = 0; Object.keys(D.daily).forEach(function (k) { total += D.daily[k]; });
    return { cur: cur, best: best, total: total };
  }
  var R = {
    profile: function () {
      var u = D.user;
      return '<div class="who"><div class="avatar" aria-hidden="true">' + esc(u.login.charAt(0).toUpperCase()) + '</div><div><h3>' + esc(u.name) + '</h3><p>@' + esc(u.login) + '</p></div></div>' +
        (u.bio ? '<p class="bio">' + esc(u.bio) + '</p>' : '') +
        '<div class="meta"><span><b>' + fmt(u.followers) + '</b> followers</span><span><b>' + fmt(u.following) + '</b> following</span><span>Joined <b>' + esc(String(u.created).slice(0, 4)) + '</b></span></div>';
    },
    stats: function () {
      var stars = 0, forks = 0; D.repos.forEach(function (r) { stars += r.stars; forks += r.forks; });
      var t = [[D.user.public_repos, "Repositories"], [stars, "Stars earned"], [forks, "Forks"], [D.user.followers, "Followers"]];
      return '<div class="tiles">' + t.map(function (x) { return '<div class="tile"><b>' + fmt(x[0]) + '</b><span>' + x[1] + '</span></div>'; }).join("") + '</div>';
    },
    heatmap: function () {
      var today = startOfDay(new Date()), start = new Date(today); start.setDate(start.getDate() - today.getDay() - 19 * 7);
      var max = 0, total = 0; Object.keys(D.daily).forEach(function (k) { max = Math.max(max, D.daily[k]); total += D.daily[k]; });
      var cells = "";
      for (var r = 0; r < 7; r++) for (var c = 0; c < 20; c++) {
        var d = new Date(start); d.setDate(start.getDate() + c * 7 + r);
        if (d > today) { cells += '<i class="cell future"></i>'; continue; }
        var n = D.daily[key(d)] || 0, lv = n === 0 ? 0 : Math.min(4, Math.ceil(4 * n / (max || 1)));
        cells += '<i class="cell l' + lv + '" title="' + n + ' on ' + key(d) + '"></i>';
      }
      var scope = D.source === "live" ? "Counted from the last 100 public events GitHub returns, so older days can look empty." : "Example activity for the last 20 weeks.";
      return '<div class="heat" role="img" aria-label="Contribution calendar, ' + total + ' contributions">' + cells + '</div>' +
        '<div class="legend">Less <i class="cell"></i><i class="cell l1"></i><i class="cell l2"></i><i class="cell l3"></i><i class="cell l4"></i> More</div>' +
        '<p class="caption">' + fmt(total) + ' contributions in 20 weeks. ' + scope + '</p>';
    },
    streak: function () {
      var s = streaks();
      return '<div class="streak"><div><div class="big">' + s.cur + '<small>days</small></div><span class="caption">Current streak</span></div><div><div class="big">' + s.best + '<small>days</small></div><span class="caption">Longest in 20 weeks</span></div></div>';
    },
    languages: function () {
      var c = {}, n = 0; D.repos.forEach(function (r) { if (r.lang) { c[r.lang] = (c[r.lang] || 0) + 1; n++; } });
      var list = Object.keys(c).map(function (k) { return [k, c[k]]; }).sort(function (a, b) { return b[1] - a[1]; }).slice(0, 6);
      if (!n) return '<p class="caption">No repositories with a detected language.</p>';
      return '<div class="stack">' + list.map(function (x) { return '<i style="flex:' + x[1] + ';background:' + langColor(x[0]) + '"></i>'; }).join("") + '</div>' +
        '<div class="keys">' + list.map(function (x) { return '<div><span class="dot" style="background:' + langColor(x[0]) + '"></span>' + esc(x[0]) + '<span class="pct">' + Math.round(100 * x[1] / n) + '%</span></div>'; }).join("") + '</div><p class="caption">Share of repositories by main language.</p>';
    },
    repos: function () {
      var l = D.repos.slice().sort(function (a, b) { return b.stars - a.stars; }).slice(0, 5);
      if (!l.length) return '<p class="caption">No public repositories.</p>';
      return '<ul class="list">' + l.map(function (r) {
        var name = r.url ? '<a href="' + esc(r.url) + '" target="_blank" rel="noopener">' + esc(r.name) + '</a>' : '<strong>' + esc(r.name) + '</strong>';
        return '<li><div class="title">' + name + '<span class="time">' + esc(ago(r.updated)) + '</span></div>' + (r.desc ? '<span class="bio">' + esc(r.desc) + '</span>' : '') +
          '<div class="sub">' + (r.lang ? '<span><i class="dot" style="background:' + langColor(r.lang) + '"></i>' + esc(r.lang) + '</span>' : '') + '<span>' + fmt(r.stars) + ' stars</span><span>' + fmt(r.forks) + ' forks</span></div></li>';
      }).join("") + '</ul>';
    },
    stars: function () {
      var l = D.repos.slice().sort(function (a, b) { return b.stars - a.stars; }).slice(0, 6), m = l.length ? l[0].stars || 1 : 1;
      return '<div class="bars">' + l.map(function (r) { return '<div class="bar-row"><span class="name" title="' + esc(r.name) + '">' + esc(r.name) + '</span><div class="track"><div class="fill" style="width:' + Math.round(100 * r.stars / m) + '%"></div></div><span class="val">' + fmt(r.stars) + '</span></div>'; }).join("") + '</div>';
    },
    mix: function () {
      var names = { PushEvent: "Pushes", PullRequestEvent: "Pull requests", PullRequestReviewEvent: "Reviews", IssuesEvent: "Issues", IssueCommentEvent: "Comments", WatchEvent: "Stars given", CreateEvent: "Branches and tags", ForkEvent: "Forks", ReleaseEvent: "Releases" };
      var c = {}; D.events.forEach(function (e) { var k = names[e.type] || "Other"; c[k] = (c[k] || 0) + 1; });
      var l = Object.keys(c).map(function (k) { return [k, c[k]]; }).sort(function (a, b) { return b[1] - a[1]; }).slice(0, 6), m = l.length ? l[0][1] : 1;
      return '<div class="bars">' + l.map(function (x) { return '<div class="bar-row"><span class="name">' + esc(x[0]) + '</span><div class="track"><div class="fill" style="width:' + Math.round(100 * x[1] / m) + '%"></div></div><span class="val">' + x[1] + '</span></div>'; }).join("") + '</div><p class="caption">From the latest ' + D.events.length + ' events.</p>';
    },
    feed: function () {
      var l = D.events.slice(0, 7);
      if (!l.length) return '<p class="caption">No recent public activity.</p>';
      return '<ul class="list">' + l.map(function (e) { return '<li><div class="title"><span>' + esc(e.text) + ' <strong>' + esc(e.repo) + '</strong></span><span class="time">' + esc(ago(e.date)) + '</span></div></li>'; }).join("") + '</ul>';
    },
    notes: function () {
      return '<textarea class="notes" id="noteBox" aria-label="Notes" placeholder="Reviews to do, repos to archive, anything you want next to your stats.">' + esc(S.note) + '</textarea>';
    }
  };

  /* ---------- render ---------- */
  function renderStatus() {
    var el = $("status");
    var badge = D.source === "live" ? '<span class="badge live">Live data</span><span>Showing public data for @' + esc(D.user.login) + '.</span>' : '<span class="badge sample">Sample data</span><span>' + esc(D.note || "These numbers are made up for @" + D.user.login + ". Load a username to fetch the real ones.") + '</span>';
    el.innerHTML = badge;
  }
  function renderGrid() {
    var g = $("grid");
    if (!S.widgets.length) { g.innerHTML = '<div class="empty s3">No widgets on the board. Open Customize and switch some on.</div>'; return; }
    g.className = "grid" + (editing ? " editing" : "");
    g.innerHTML = S.widgets.map(function (w, i) {
      var def = WIDGETS[w.id]; if (!def) return "";
      var sizes = ["S", "M", "L"].map(function (lab, n) { return '<button class="tool" data-act="size" data-id="' + w.id + '" data-n="' + (n + 1) + '" aria-pressed="' + (w.size === n + 1) + '" title="Span ' + (n + 1) + ' column(s)">' + lab + '</button>'; }).join("");
      return '<section class="w s' + w.size + '" data-id="' + w.id + '" draggable="' + editing + '" aria-label="' + esc(def.title) + '"><div class="w-head"><h2>' + esc(def.title) + '</h2><div class="tools">' + sizes +
        '<button class="tool" data-act="left" data-id="' + w.id + '" aria-label="Move earlier"' + (i === 0 ? " disabled" : "") + '>&larr;</button><button class="tool" data-act="right" data-id="' + w.id + '" aria-label="Move later"' + (i === S.widgets.length - 1 ? " disabled" : "") + '>&rarr;</button><button class="tool" data-act="remove" data-id="' + w.id + '" aria-label="Remove ' + esc(def.title) + '">&times;</button></div></div>' + R[w.id]() + '</section>';
    }).join("");
    var nb = $("noteBox"); if (nb) nb.addEventListener("input", function () { S.note = nb.value; save(); });
  }
  function renderPanel() {
    document.querySelectorAll("#themeSeg button").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.v === S.theme); });
    document.querySelectorAll("#densitySeg button").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.v === S.density); });
    $("swatches").innerHTML = ACCENTS.map(function (a) { return '<button class="sw" data-hue="' + a[1] + '" title="' + a[0] + '" aria-label="' + a[0] + ' accent" aria-pressed="' + (S.hue === a[1]) + '" style="background:oklch(0.62 0.17 ' + a[1] + ')"></button>'; }).join("");
    var on = {}; S.widgets.forEach(function (w) { on[w.id] = 1; });
    $("chips").innerHTML = Object.keys(WIDGETS).map(function (id) { return '<button class="chip" data-id="' + id + '" aria-pressed="' + !!on[id] + '">' + esc(WIDGETS[id].title) + '</button>'; }).join("");
    $("layoutJson").value = JSON.stringify({ theme: S.theme, hue: S.hue, density: S.density, widgets: S.widgets });
  }
  function applyLook() {
    var r = document.documentElement;
    r.style.setProperty("--hue", S.hue);
    r.setAttribute("data-density", S.density);
    if (S.theme === "auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", S.theme);
  }
  function renderAll() { applyLook(); renderStatus(); renderGrid(); renderPanel(); }

  /* ---------- interactions ---------- */
  $("userForm").addEventListener("submit", function (e) { e.preventDefault(); load($("userInput").value, true); });
  $("editBtn").addEventListener("click", function () {
    editing = !editing; $("editBtn").setAttribute("aria-pressed", editing); $("editBtn").textContent = editing ? "Done" : "Customize";
    $("panel").hidden = !editing; renderGrid();
  });
  function pressed(sel, attr, fn) { $(sel).addEventListener("click", function (e) { var b = e.target.closest("button"); if (!b) return; fn(b); save(); renderAll(); }); }
  pressed("themeSeg", "v", function (b) { S.theme = b.dataset.v; });
  pressed("densitySeg", "v", function (b) { S.density = b.dataset.v; });
  pressed("swatches", "hue", function (b) { S.hue = Number(b.dataset.hue); });
  pressed("chips", "id", function (b) {
    var id = b.dataset.id, i = S.widgets.findIndex(function (w) { return w.id === id; });
    if (i >= 0) S.widgets.splice(i, 1); else S.widgets.push({ id: id, size: WIDGETS[id].size });
  });
  $("grid").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-act]"); if (!b) return;
    var id = b.dataset.id, i = S.widgets.findIndex(function (w) { return w.id === id; }), a = b.dataset.act;
    if (a === "remove") S.widgets.splice(i, 1);
    else if (a === "size") S.widgets[i].size = Number(b.dataset.n);
    else { var j = a === "left" ? i - 1 : i + 1; if (j < 0 || j >= S.widgets.length) return; var t = S.widgets[i]; S.widgets[i] = S.widgets[j]; S.widgets[j] = t; }
    save(); renderAll();
  });
  var grid = $("grid");
  grid.addEventListener("dragstart", function (e) { var w = e.target.closest(".w"); if (!editing || !w) return; dragId = w.dataset.id; w.classList.add("dragging"); try { e.dataTransfer.setData("text/plain", dragId); e.dataTransfer.effectAllowed = "move"; } catch (x) {} });
  grid.addEventListener("dragover", function (e) { if (!dragId) return; e.preventDefault(); var w = e.target.closest(".w"); grid.querySelectorAll(".over").forEach(function (n) { n.classList.remove("over"); }); if (w && w.dataset.id !== dragId) w.classList.add("over"); });
  grid.addEventListener("drop", function (e) {
    var w = e.target.closest(".w"); if (!dragId || !w || w.dataset.id === dragId) return; e.preventDefault();
    var from = S.widgets.findIndex(function (x) { return x.id === dragId; }), to = S.widgets.findIndex(function (x) { return x.id === w.dataset.id; });
    var item = S.widgets.splice(from, 1)[0]; S.widgets.splice(to, 0, item); save(); dragId = null; renderAll();
  });
  grid.addEventListener("dragend", function () { dragId = null; grid.querySelectorAll(".dragging,.over").forEach(function (n) { n.classList.remove("dragging", "over"); }); });

  $("copyLayout").addEventListener("click", function () {
    var ta = $("layoutJson"); ta.select();
    try { navigator.clipboard.writeText(ta.value).then(function () { toast("Layout copied."); }, function () { toast("Press Ctrl+C to copy the selected text."); }); }
    catch (e) { toast("Press Ctrl+C to copy the selected text."); }
  });
  $("applyLayout").addEventListener("click", function () {
    try {
      var j = JSON.parse($("layoutJson").value);
      if (!Array.isArray(j.widgets)) throw 0;
      var ws = j.widgets.filter(function (w) { return w && WIDGETS[w.id]; }).map(function (w) { return { id: w.id, size: [1, 2, 3].indexOf(w.size) >= 0 ? w.size : WIDGETS[w.id].size }; });
      S.widgets = ws; if (["auto", "light", "dark"].indexOf(j.theme) >= 0) S.theme = j.theme;
      if (typeof j.hue === "number") S.hue = j.hue; if (["compact", "cozy", "roomy"].indexOf(j.density) >= 0) S.density = j.density;
      save(); renderAll(); toast("Layout applied.");
    } catch (e) { toast("That layout text could not be read. Copy it again from another Gitdeck."); }
  });
  $("resetLayout").addEventListener("click", function () { var u = S.user, n = S.note; S = defaults(); S.user = u; S.note = n; save(); renderAll(); toast("Layout reset."); });

  $("userInput").value = S.user;
  load(S.user, false);
})();
</script>
