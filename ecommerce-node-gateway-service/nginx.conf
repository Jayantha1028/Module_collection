# Edge gateway: serves the storefront and routes /api/* to the microservices.
# /internal/* is deliberately NOT routed, so service-to-service endpoints stay private.
# Service names and ports are identical in Docker Compose and Kubernetes.

limit_req_zone $binary_remote_addr zone=authlimit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=apilimit:10m rate=30r/s;

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_connect_timeout 3s;
  proxy_read_timeout 15s;

  location = /healthz { access_log off; return 200 "ok\n"; }

  # Brute-force protection on login and registration
  location /api/auth/ {
    limit_req zone=authlimit burst=10 nodelay;
    proxy_pass http://auth-service:3001;
  }

  location /api/products {
    limit_req zone=apilimit burst=60 nodelay;
    proxy_pass http://product-service:3002;
  }

  location /api/cart {
    limit_req zone=apilimit burst=60 nodelay;
    proxy_pass http://cart-service:3003;
  }

  location /api/orders {
    limit_req zone=apilimit burst=60 nodelay;
    proxy_pass http://order-service:3004;
  }

  location /api/ { return 404; }
  location /internal/ { return 404; }

  location / {
    try_files $uri /index.html;
  }
}
